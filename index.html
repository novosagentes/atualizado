<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Redirecionando...</title>
  <script>
    // Obtém o caminho base do repositório dinamicamente (ex: "/atualizado/" ou "/")
    var path = window.location.pathname;
    if (!path.endsWith('/')) {
      path += '/';
    }
    var destino = path + 'selecao/' + (window.location.search || '');
    window.location.replace(destino);
  </script>
</head>
<body>
  <p><a href="selecao/">Clique aqui caso não seja redirecionado automaticamente</a></p>
</body>
</html>
